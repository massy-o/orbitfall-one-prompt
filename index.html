<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORBITFALL — a one-prompt game</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04040c; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Segoe UI', system-ui, sans-serif; }
  #wrap { position:relative; }
  canvas { display:block; border-radius:8px; touch-action:none; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="900" height="900"></canvas></div>
<script>
'use strict';
// ============================================================
// ORBITFALL — built from ONE prompt (see PROMPT.md)
// One button. Two rings. Don't get hit.
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 900, CX = W/2, CY = H/2;
const R_IN = 148, R_OUT = 252, STAR_R = 62;

// ---------- deterministic starfield ----------
let seed = 1234567;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
const stars = [];
for (let i=0;i<170;i++) stars.push({x:rnd()*W, y:rnd()*H, r:rnd()*1.6+0.3, p:rnd()*Math.PI*2, s:0.5+rnd()*1.5});

// ---------- state ----------
let state = 'title'; // title | playing | dead
let tGlobal = 0, lastTs = 0;
let score = 0, best = 0, combo = 0, comboTimer = 0, comboTimerMax = 2.6, runTime = 0;
let deadAt = 0;
try { best = parseInt(localStorage.getItem('orbitfall_best')||'0',10)||0; } catch(e) {}

// player
const player = { angle: -Math.PI/2, ring: 0, radius: R_IN, trail: [] }; // ring 0=inner 1=outer
let omega = 1.6;

// shards & motes & particles & popups
let shards = [], motes = [], parts = [], popups = [];
let shardTimer = 0, moteTimer = 1.2;
let pulseFx = 0, lastMilestone = 0;
let shake = 0;
let timeScale = 1, hitStop = 0;

const DEMO = new URLSearchParams(location.search).has('demo');

// ---------- tiny synthesized SFX (no audio files) ----------
let AC = null;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
const sfx = {
  switch: () => tone(520, 0.09, 'triangle', 0.10, 880),
  mote:   () => { tone(880, 0.10, 'sine', 0.12); setTimeout(() => tone(1318, 0.14, 'sine', 0.10), 45); },
  near:   () => tone(300, 0.16, 'sawtooth', 0.05, 720),
  die:    () => { tone(220, 0.5, 'sawtooth', 0.16, 40); tone(110, 0.6, 'square', 0.10, 30); },
  start:  () => { tone(440, 0.1, 'triangle', 0.10); setTimeout(() => tone(660, 0.12, 'triangle', 0.10), 70); },
};

function ringRadius(ring){ return ring === 0 ? R_IN : R_OUT; }
function angDiff(a,b){ let d = (a-b) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return Math.abs(d); }

function reset(){
  score = 0; combo = 0; comboTimer = 0; runTime = 0;
  shards = []; motes = []; parts = []; popups = [];
  shardTimer = 0.9; moteTimer = 1.0;
  player.angle = -Math.PI/2; player.ring = 0; player.radius = R_IN; player.trail = [];
  omega = 1.6; shake = 0;
  lastMilestone = 0; hitStop = 0; timeScale = 1;
}

function burst(x, y, color, n, spd){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.3+Math.random()*0.7)*spd;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, decay:1.4+Math.random()*1.6, color, r:1.5+Math.random()*2.5});
  }
}
function popup(x, y, text, color){ popups.push({x, y, text, color, life:1, age:0}); }

function playerPos(){
  return { x: CX + Math.cos(player.angle)*player.radius, y: CY + Math.sin(player.angle)*player.radius };
}

function switchRing(){
  player.ring = 1 - player.ring;
  sfx.switch();
  const p = playerPos();
  burst(p.x, p.y, '#39e6ff', 10, 130);
}

function press(){
  audio();
  if (state === 'title'){ reset(); state = 'playing'; sfx.start(); }
  else if (state === 'playing'){ switchRing(); }
  else if (state === 'dead' && performance.now() - deadAt > 700){ reset(); state = 'playing'; sfx.start(); }
}
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); press(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

// ---------- spawning ----------
function difficulty(){ return Math.min(1, runTime / 75); } // 0..1 over 75s
let lastShardAngle = -10, lastShardTime = -10;
function spawnShard(){
  const d = difficulty();
  let a = Math.random()*Math.PI*2;
  // fairness: never drop a shard almost on top of the previous one in angle+time
  if (runTime - lastShardTime < 0.85 && angDiff(a, lastShardAngle) < 0.55) a = lastShardAngle + 0.55 + Math.random()*0.7;
  lastShardAngle = a; lastShardTime = runTime;
  shards.push({ age: 0, angle:a, r: 600, speed: 150 + d*120 + Math.random()*30, rot: Math.random()*Math.PI*2, vr:(Math.random()-0.5)*3, scoredIn:false, scoredOut:false, size: 11+Math.random()*7 });
}
function spawnMote(){
  const ring = Math.random() < 0.5 ? 0 : 1;
  // place it ahead of the player so it is reachable
  const a = player.angle + 1.2 + Math.random()*2.4;
  motes.push({ angle:a, ring, life: 6.5, maxLife: 6.5 });
}

// ---------- update ----------
function update(dt){
  tGlobal += dt;
  // particles & popups always animate
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= p.decay*dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of popups){ p.y -= 34*dt; p.life -= dt*0.9; p.age += dt; }
  popups = popups.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt*26);
  pulseFx = Math.max(0, pulseFx - dt*1.6);

  if (state !== 'playing'){
    // idle orbit on title / death screens
    player.angle += 0.5*dt;
    player.radius += (ringRadius(player.ring) - player.radius) * Math.min(1, dt*10);
    return;
  }

  runTime += dt;
  const d = difficulty();
  omega = 1.6 + d*1.15;
  player.angle += omega * dt;
  player.radius += (ringRadius(player.ring) - player.radius) * Math.min(1, dt*14);
  score += dt * 6;

  // trail
  const pp = playerPos();
  player.trail.push({x:pp.x, y:pp.y, life:1});
  if (player.trail.length > 26) player.trail.shift();
  for (const t of player.trail) t.life -= dt*3.2;

  // combo decay
  if (comboTimer > 0){ comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // shards
  shardTimer -= dt;
  if (shardTimer <= 0){ spawnShard(); shardTimer = (1.12 - d*0.57) * (0.75 + Math.random()*0.5); }
  for (const s of shards){
    s.age += dt; s.r -= s.speed * dt; s.rot += s.vr * dt;
    for (const ring of [0,1]){
      const R = ringRadius(ring);
      const key = ring === 0 ? 'scoredIn' : 'scoredOut';
      if (!s[key] && s.r < R + 6 && s.r > R - 30){
        if (player.ring !== ring){ if (s.r < R - 28) s[key] = true; }
        else {
          s[key] = true;
          const ad = angDiff(s.angle, player.angle);
          if (ad < 24/R){ die(); return; }
          if (ad < 58/R){
            combo++; comboTimer = comboTimerMax = 2.6 - difficulty()*0.6;
            if (combo % 5 === 0 && combo !== lastMilestone){
              lastMilestone = combo; pulseFx = 1;
              tone(523, 0.22, 'triangle', 0.10); setTimeout(() => tone(784, 0.3, 'triangle', 0.10), 60);
              const pc = playerPos(); popup(pc.x, pc.y - 52, 'COMBO ×' + combo + '!', '#ffffff');
            }
            const pts = 10 * combo;
            score += pts;
            const p2 = playerPos();
            popup(p2.x, p2.y - 26, 'NEAR MISS +' + pts, '#ff4fd8');
            sfx.near();
            hitStop = Math.max(hitStop, 0.075);
            burst(p2.x, p2.y, '#ff4fd8', 8, 110);
            shake = Math.max(shake, 3);
          }
        }
      }
    }
    if (s.r < STAR_R + 8){
      s.dead = true;
      burst(CX + Math.cos(s.angle)*(STAR_R+4), CY + Math.sin(s.angle)*(STAR_R+4), '#ffb347', 7, 90);
    }
  }
  shards = shards.filter(s => !s.dead);

  // motes
  moteTimer -= dt;
  if (moteTimer <= 0){ spawnMote(); moteTimer = 1.7 + Math.random()*1.1; }
  for (const m of motes){
    m.life -= dt;
    if (m.ring === player.ring && angDiff(m.angle, player.angle) < 24/ringRadius(m.ring) && Math.abs(player.radius - ringRadius(m.ring)) < 26){
      m.dead = true;
      const mult = Math.min(8, Math.max(1, combo));
      const pts = 20 * mult;
      score += pts; comboTimer = comboTimerMax = 2.6 - difficulty()*0.6;
      const p2 = playerPos();
      popup(p2.x, p2.y - 26, '+' + pts, '#ffd94d');
      sfx.mote();
      hitStop = Math.max(hitStop, 0.04);
      burst(p2.x, p2.y, '#ffd94d', 12, 140);
    }
  }
  motes = motes.filter(m => !m.dead && m.life > 0);
}

function die(){
  state = 'dead'; deadAt = performance.now();
  sfx.die();
  hitStop = 0; timeScale = 1;
  const p = playerPos();
  burst(p.x, p.y, '#39e6ff', 46, 260);
  burst(p.x, p.y, '#ffffff', 20, 170);
  shake = 14;
  score = Math.floor(score);
  if (score > best){ best = score; try { localStorage.setItem('orbitfall_best', String(best)); } catch(e){} }
}

// ---------- draw ----------
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  // background
  const bg = ctx.createRadialGradient(CX, CY, 60, CX, CY, 640);
  bg.addColorStop(0, '#10102a'); bg.addColorStop(0.55, '#070716'); bg.addColorStop(1, '#030309');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W+40, H+40);
  const neb = [[210,180,300,'rgba(64,30,140,0.20)'],[700,640,340,'rgba(150,20,90,0.15)'],[660,170,240,'rgba(10,80,120,0.16)'],[170,700,260,'rgba(20,40,130,0.15)']];
  for (const n of neb){
    const ng = ctx.createRadialGradient(n[0], n[1], 10, n[0], n[1], n[2]);
    ng.addColorStop(0, n[3]); ng.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ng; ctx.fillRect(n[0]-n[2], n[1]-n[2], n[2]*2, n[2]*2);
  }
  for (const s of stars){
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(tGlobal*s.s + s.p));
    ctx.globalAlpha = tw * 0.8;
    ctx.fillStyle = '#cfe8ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // rings
  for (const ring of [0,1]){
    const R = ringRadius(ring);
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2);
    ctx.strokeStyle = player.ring === ring && state === 'playing' ? 'rgba(57,230,255,0.34)' : 'rgba(140,160,255,0.14)';
    ctx.lineWidth = player.ring === ring && state === 'playing' ? 2.5 : 1.5;
    ctx.setLineDash([4, 9]); ctx.lineDashOffset = -tGlobal*14; ctx.stroke(); ctx.setLineDash([]);
  }

  // star with corona
  const pulse = 1 + Math.sin(tGlobal*2.4)*0.045;
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(tGlobal*0.12);
  for (let i=0;i<12;i++){
    ctx.rotate(Math.PI/6);
    const len = STAR_R * (1.5 + 0.35*Math.sin(tGlobal*3 + i*1.7));
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, 'rgba(255,170,60,0.5)'); g.addColorStop(1, 'rgba(255,80,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(STAR_R*0.55, -5); ctx.lineTo(len, 0); ctx.lineTo(STAR_R*0.55, 5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const sg = ctx.createRadialGradient(CX, CY, 4, CX, CY, STAR_R*pulse*1.9);
  sg.addColorStop(0, 'rgba(255,252,235,1)');
  sg.addColorStop(0.35, 'rgba(255,180,80,0.85)');
  sg.addColorStop(0.7, 'rgba(255,90,110,0.35)');
  sg.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(CX, CY, STAR_R*pulse*1.9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fffbe8';
  ctx.beginPath(); ctx.arc(CX, CY, STAR_R*0.52*pulse, 0, Math.PI*2); ctx.fill();

  // combo milestone pulse ring
  if (pulseFx > 0){
    ctx.globalAlpha = pulseFx * 0.7;
    ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, (1-pulseFx)*330 + 60, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // motes
  for (const m of motes){
    const R = ringRadius(m.ring);
    const x = CX + Math.cos(m.angle)*R, y = CY + Math.sin(m.angle)*R;
    const a = Math.min(1, m.life/1.2) * (0.7 + 0.3*Math.sin(tGlobal*6 + m.angle*3));
    ctx.globalAlpha = a;
    ctx.shadowColor = '#ffd94d'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // spawn warning markers (incoming shard telegraphs)
  for (const s of shards){
    if (s.age < 0.55){
      const wx = CX + Math.cos(s.angle)*438, wy = CY + Math.sin(s.angle)*438;
      const blink = 0.45 + 0.55*Math.abs(Math.sin(tGlobal*16));
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(s.angle + Math.PI/2);
      ctx.globalAlpha = blink * (1 - s.age/0.55) + 0.25;
      ctx.fillStyle = '#ff4fd8';
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(9, -7); ctx.lineTo(-9, -7); ctx.closePath(); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  // shards
  for (const s of shards){
    const x = CX + Math.cos(s.angle)*s.r, y = CY + Math.sin(s.angle)*s.r;
    ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot);
    ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#4a1a58';
    ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 2;
    ctx.beginPath();
    const n = 7;
    for (let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2, rr = s.size * (i%2 ? 0.62 : 1);
      if (i===0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr); else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,79,216,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, s.size*0.22, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // comet trail
  for (const t of player.trail){
    if (t.life <= 0) continue;
    ctx.globalAlpha = t.life * 0.35;
    ctx.fillStyle = '#39e6ff';
    ctx.beginPath(); ctx.arc(t.x, t.y, 7*t.life + 1, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player comet
  if (state !== 'dead'){
    const p = playerPos();
    ctx.shadowColor = '#39e6ff'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#eaffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(57,230,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 13.5 + Math.sin(tGlobal*7)*1.5, 0, Math.PI*2); ctx.stroke();
  }

  // particles
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // popups
  ctx.textAlign = 'center';
  for (const p of popups){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 21px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    const sc = p.age < 0.15 ? 1.15 - (p.age/0.15)*0.15 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sc, sc);
    ctx.fillText(p.text, 0, 0);
    ctx.restore(); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(CX, CY, 330, CX, CY, 660);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // ---------- HUD / screens ----------
  ctx.textAlign = 'center';
  if (state === 'playing' || state === 'dead'){
    ctx.textAlign = 'left';
    ctx.font = 'bold 34px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#eaffff';
    ctx.fillText(String(Math.floor(score)), 28, 52);
    ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(200,220,255,0.65)';
    ctx.fillText('BEST ' + best, 30, 78);
    ctx.textAlign = 'center';
    if (combo > 1){
      ctx.font = 'bold 26px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#ff4fd8';
      ctx.fillText('COMBO ×' + combo, CX, 54);
      const w = 130, frac = Math.max(0, comboTimer/comboTimerMax);
      ctx.fillStyle = 'rgba(255,79,216,0.25)';
      ctx.fillRect(CX - w/2, 66, w, 5);
      ctx.fillStyle = '#ff4fd8';
      ctx.fillRect(CX - w/2, 66, w*frac, 5);
    }
  }
  if (state === 'title'){
    ctx.fillStyle = 'rgba(3,3,12,0.45)'; ctx.fillRect(0, 0, W, H);
    ctx.font = '900 92px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#39e6ff';
    ctx.shadowColor = '#39e6ff'; ctx.shadowBlur = 34;
    ctx.fillText('ORBITFALL', CX, 300);
    ctx.shadowBlur = 0;
    ctx.font = '600 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd9f6';
    ctx.fillText('One button. Two rings. Don\'t get hit.', CX, 348);
    ctx.font = '500 19px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,235,255,0.9)';
    ctx.fillText('SPACE / CLICK / TAP — switch rings', CX, 560);
    ctx.fillText('Dodge the magenta shards. Collect the golden motes.', CX, 592);
    ctx.fillText('Near misses build your combo.', CX, 624);
    ctx.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd94d';
    ctx.fillText('PRESS TO START', CX, 692);
    if (best > 0){ ctx.font = '600 17px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.fillText('BEST ' + best, CX, 730); }
  }
  if (state === 'dead'){
    ctx.fillStyle = 'rgba(10,2,8,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.font = '900 64px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ff4fd8';
    ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 28;
    ctx.fillText('SHATTERED', CX, 360);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 40px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#eaffff';
    ctx.fillText('SCORE ' + Math.floor(score), CX, 440);
    ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(200,220,255,0.8)';
    ctx.fillText('BEST ' + best, CX, 478);
    ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd94d';
    ctx.fillText('PRESS TO FLY AGAIN', CX, 580);
  }
}

// ---------- demo autopilot (attract mode / video capture) ----------
function autopilot(){
  if (state === 'title'){ press(); return; }
  if (state === 'dead'){ if (performance.now() - deadAt > 900) press(); return; }
  // danger check for a ring: a shard that will cross it soon, aligned with where we will be
  function danger(ring){
    const R = ringRadius(ring);
    for (const s of shards){
      if (s.r <= R) continue;
      const tc = (s.r - R) / s.speed;
      if (tc > 0.55) continue;
      const future = player.angle + omega * tc;
      if (angDiff(s.angle, future) < 0.52) return true;
    }
    return false;
  }
  if (danger(player.ring) && !danger(1 - player.ring)) switchRing();
  else {
    // drift toward a mote on the other ring when safe
    for (const m of motes){
      if (m.ring !== player.ring && !danger(m.ring) && angDiff(m.angle, player.angle + 0.9) < 0.6){ switchRing(); break; }
    }
  }
}

// ---------- main loop ----------
function frame(ts){
  let dt = Math.min(0.05, (ts - lastTs)/1000 || 0.016);
  lastTs = ts;
  if (hitStop > 0){ hitStop -= dt; timeScale = 0.22; } else timeScale = Math.min(1, timeScale + dt*7);
  dt *= timeScale;
  if (DEMO) autopilot();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// responsive fit
function fit(){
  const s = Math.min(window.innerWidth, window.innerHeight);
  canvas.style.width = s + 'px'; canvas.style.height = s + 'px';
}
window.addEventListener('resize', fit); fit();
</script>
